name: thalexa
description: Blockchain-powered platform for wallet, payments, and product verification.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  go_router: ^10.0.0
  supabase_flutter: ^1.10.0
  web3auth_flutter: ^4.0.0
  web3dart: ^2.6.1
  http: ^1.1.0
  intl: ^0.18.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.2.0
  font_awesome_flutter: ^10.4.0
  google_fonts: ^5.0.0
  flutter_secure_storage: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: FontAwesome
      fonts:
        - asset: packages/font_awesome_flutter/lib/fonts/fa-solid-900.ttf
